<form method="get" class="panel filter-grid">
<label>Номер<input name="search" value="{{ filters.search }}" placeholder="НЗ-0001" maxlength="80"></label>
<label>С даты смены<input type="date" name="date_from" value="{{ filters.date_from or '' }}"></label><label>По дату смены<input type="date" name="date_to" value="{{ filters.date_to or '' }}"></label>
<label>Подрядчик<input type="search" data-search-select="filter-contractor" placeholder="Поиск организации" aria-label="Найти подрядчика"><select id="filter-contractor" name="contractor_id"><option value="">Все организации</option>{% for c in contractors %}<option value="{{ c.id }}" {% if filters.contractor_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label>
<label>Корпус<select name="building_id"><option value="">Все корпуса</option>{% for b in buildings %}<option value="{{ b.id }}" {% if filters.building_id==b.id %}selected{% endif %}>{{ b.name }}{{ ' · архив' if b.status=='archived' else '' }}</option>{% endfor %}</select></label>
<label>Бригада<input type="search" data-search-select="filter-brigade" placeholder="Номер / подрядчик" aria-label="Найти бригаду"><select id="filter-brigade" name="brigade_id"><option value="">Все бригады</option>{% for b in permanent_brigades %}<option value="{{ b.id }}" {% if filters.brigade_id==b.id %}selected{% endif %}>№ {{ b.number }} · {{ b.contractor_name }}</option>{% endfor %}</select></label>
<label>Статус<select name="status"><option value="">Все статусы</option>{% for key,label in order_statuses.items() %}<option value="{{ key }}" {% if filters.status==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
{% for key,label in [('has_remaining','Есть незакрытый остаток'),('has_transfer','Есть перенос'),('unclosed','Наряд не закрыт'),('discrepancies','Есть расхождения')] %}<label>{{ label }}<select name="{{ key }}"><option value="">Все</option><option value="1" {% if filters.get(key) is sameas true %}selected{% endif %}>Да</option><option value="0" {% if filters.get(key) is sameas false %}selected{% endif %}>Нет</option></select></label>{% endfor %}
<label>Дата среза<input type="date" name="report_date" value="{{ report_date }}"></label><label>Отсечение знаний (UTC)<input name="knowledge_cutoff" value="{{ cutoff if request.args.get('knowledge_cutoff') else '' }}" placeholder="Текущее состояние" maxlength="40"></label>
<div><button type="submit">Применить</button> <a href="{{ url_for(request.endpoint) }}">Сбросить</a></div></form>
