<form method="get" class="panel analytics-filters" data-analytics-filters>
<label>Направление<select name="discipline" data-reset-version>{% for key,label in discipline_labels.items() %}<option value="{{ key }}" {% if discipline==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Корпус<select name="building_id"><option value="">Все корпуса</option>{% for b in filter_buildings %}<option value="{{ b.id }}" {% if filters.building_id==b.id %}selected{% endif %}>{{ b.name }}{{ ' · архив' if b.status=='archived' else '' }}</option>{% endfor %}</select></label>
<label>Этаж<select name="floor_id"><option value="">Все этажи</option>{% for f in floors if not filters.building_id or filters.building_id==f.building_id %}<option value="{{ f.id }}" {% if filters.floor_id==f.id %}selected{% endif %}>{{ f.building_name }} · {{ f.floor_code }}</option>{% endfor %}</select></label>
<label>Конструктив<select name="element"><option value="">Все элементы</option>{% for e in elements %}<option {% if filters.element==e %}selected{% endif %}>{{ e }}</option>{% endfor %}</select></label>
<label>Код вида работ<select name="catalog_id"><option value="">Все коды</option>{% for c in catalog %}<option value="{{ c.id }}" {% if filters.catalog_id==c.id %}selected{% endif %}>{{ c.code }} · {{ c.name }} · {{ c.unit }}</option>{% endfor %}</select></label>
<label>Аналитическая группа<select name="group_id"><option value="">Все исходные позиции</option>{% for g in filter_groups if g.discipline==discipline %}<option value="{{ g.group_id }}" {% if group_id==g.group_id %}selected{% endif %}>{{ g.name }} · состав V{{ g.version_no }}{{ ' · архив' if g.archived else '' }}</option>{% endfor %}</select></label>
<label>Утверждённый план<select name="version_id"><option value="">Действующий на дату среза</option>{% for v in versions %}<option value="{{ v.id }}" {% if query.version_id==v.id %}selected{% endif %}>V{{ v.version_no }} · {{ v.approved_at[:10] }}</option>{% endfor %}</select></label>
<label>Редакция группы<input name="group_version" value="{{ group_version or '' }}" inputmode="numeric" placeholder="На момент знания"></label>
<label>Начало периода<input type="date" name="start_date" value="{{ start_date }}" required></label><label>Конец периода<input type="date" name="end_date" value="{{ end_date }}" required></label>
<label>Шаг динамики<select name="bucket">{% for key,label in [('day','День'),('week','Неделя (пн–вс)'),('month','Месяц'),('range','Весь диапазон')] %}<option value="{{ key }}" {% if bucket==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Дата среза<input type="date" name="report_date" value="{{ report_date }}" required></label>
<label class="wide-field">Отсечение знаний (UTC)<input name="knowledge_cutoff" value="{{ cutoff }}" maxlength="40"></label>
<label>Отклонения<select name="deviation">{% for key,label in [('all','Все позиции'),('pending','Есть неподтверждённый факт'),('overrun','Превышен план'),('no_actual','Нет выполнения'),('complete','Полностью выполнено'),('confirmed','Полностью подтверждено')] %}<option value="{{ key }}" {% if deviation_mode==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<div class="filter-actions"><button type="submit">Применить</button><a class="button secondary" href="{{ url_for('analytics.index',tab=tab) }}">Сбросить / текущее знание</a></div>
</form>
