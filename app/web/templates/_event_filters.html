<form method="get" class="panel filters" data-dependent-form><div class="filter-grid">
<label>Направление<select name="discipline" aria-label="Направление" data-reset-version>{% for key,label in discipline_labels.items() %}<option value="{{ key }}" {% if discipline.value==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Корпус<select name="building_id" data-building aria-label="Корпус"><option value="">Все корпуса</option>{% for b in buildings %}<option value="{{ b.id }}" {% if filters.building_id==b.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></label>
<label>Этаж<select name="floor_id" data-floor aria-label="Этаж"><option value="">Все этажи</option>{% for f in floors %}<option value="{{ f.id }}" data-building="{{ f.building_id }}" {% if filters.floor_id==f.id %}selected{% endif %}>{{ f.building_name }} · {{ f.floor_code }}</option>{% endfor %}</select></label>
<label>Конструктивный элемент<select name="element" aria-label="Конструктивный элемент"><option value="">Все элементы</option>{% for value in elements %}<option {% if filters.element==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
<label>Вид работ<select name="work_type" aria-label="Вид работ"><option value="">Все виды работ</option>{% for value in work_types %}<option {% if filters.work_type==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
<label>Версия плана<select name="version_id" aria-label="Версия плана"><option value="">Действующая на дату среза</option>{% for v in versions if v.status=='APPROVED' %}<option value="{{ v.id }}" {% if version and version.id==v.id %}selected{% endif %}>Версия {{ v.version_no }}</option>{% endfor %}</select></label>
<label>Дата среза<input type="date" name="report_date" value="{{ report_date }}" required></label>
<label class="wide-field">Отсечение знаний<input name="knowledge_cutoff" value="{{ request.args.get('knowledge_cutoff','') }}" placeholder="Текущий момент, либо время ISO с часовым поясом" maxlength="40"></label>
<input type="hidden" name="tab" value="{{ tab }}">{% if correction_mode %}<input type="hidden" name="correction" value="1">{% endif %}
<div class="filter-actions"><button class="secondary" type="submit">Показать</button><a href="{{ url_for(request.endpoint,discipline=discipline.value) }}">Сбросить</a></div></div></form>
